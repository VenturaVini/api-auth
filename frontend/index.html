<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/styles.css"> <!-- Link para o arquivo CSS -->
    <script src="js/app.js" defer></script>
</head>
<body>
    <!-- Botão para alternar o modo escuro -->
    <button id="toggle-dark-mode" class="dark-mode-toggle">Modo Escuro</button>

    <div class="container">
        <div class="login-box">
            <h1>Login</h1>
            <form id="login-form">
                <input type="text" id="login-username" placeholder="Nome de Usuário" required>
                <input type="password" id="login-password" placeholder="Senha" required>
                <button type="submit" class="btn">Entrar</button>
            </form>
            <p class="signup-link">Não tem uma conta? <a href="register.html">Registre-se aqui</a></p>
        </div>
    </div>
</body>
</html>
