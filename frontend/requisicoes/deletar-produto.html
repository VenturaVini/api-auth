<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deletar Produto</title>
    <link rel="stylesheet" href="../css/styles.css"> <!-- Link para o arquivo CSS externo -->
</head>
<body>

    <div class="container">
        <div class="login-box">
            <h1>Deletar Produto</h1>

            <form id="deletar-produto-form">
                <div class="form-group">
                    <label for="produto-id">ID do Produto:</label>
                    <input type="number" id="produto-id" name="id" required class="form-control">
                </div>

                <button type="submit" class="btn">Deletar Produto</button>
            </form>

            <div id="message" class="message"></div>
        </div>
    </div>
    <script src="../js/app.js"></script>
</body>
</html>
