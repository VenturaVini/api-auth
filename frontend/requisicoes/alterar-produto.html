<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar Produto</title>
    <link rel="stylesheet" href="../css/styles.css"> <!-- Link para o arquivo CSS externo -->
</head>
<body>

    <div class="container">
        <div class="login-box">
            <h1>Alterar Produto</h1>

            <form id="alterar-produto-form">
                <div class="form-group">
                    <label for="produto-id">ID do Produto:</label>
                    <input type="number" id="produto-id" name="id" required class="form-control">
                </div>

                <div class="form-group">
                    <label for="produto-nome">Nome do Produto:</label>
                    <input type="text" id="produto-nome" name="nome" required class="form-control">
                </div>

                <div class="form-group">
                    <label for="produto-descricao">Descrição do Produto:</label>
                    <input type="text" id="produto-descricao" name="descricao" required class="form-control">
                </div>

                <div class="form-group">
                    <label for="produto-preco">Preço:</label>
                    <input type="number" id="produto-preco" name="preco" required class="form-control">
                </div>

                <div class="form-group">
                    <label for="produto-estoque">Estoque:</label>
                    <input type="number" id="produto-estoque" name="estoque" required class="form-control">
                </div>

                <button type="submit" class="btn">Alterar Produto</button>
            </form>

            <div id="message" class="message"></div>
        </div>
    </div>

    <script src="../js/app.js"></script>
</body>
</html>
