<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar Senha</title>
    <link rel="stylesheet" href="css/styles.css"> <!-- Link para o arquivo CSS -->
</head>
<body>


    <div class="container">
        <div class="login-box">
            <h1>Alterar Senha</h1>
            <form id="change-password-form">
                <input type="text" id="change-username" placeholder="Nome de Usuário" required>
                <input type="password" id="current-password" placeholder="Senha Atual" required>
                <input type="password" id="new-password" placeholder="Nova Senha" required>
                <button type="submit" class="btn">Alterar Senha</button>
            </form>
        </div>
    </div>

    <script src="../js/app.js"></script>
</body>
</html>
